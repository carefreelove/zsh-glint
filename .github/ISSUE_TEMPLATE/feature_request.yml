name: Feature proposal / 功能建议
description: Suggest an improvement / 提出改进建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / 希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior / 期望行为
      description: Include a concrete command-line example / 请提供具体终端操作示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs / 替代方案与取舍
