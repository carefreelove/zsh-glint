name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check Zsh syntax
        shell: bash
        run: |
          zsh --version
          for script in terminal-completion.plugin.zsh scripts/*.zsh; do
            zsh -n "$script"
          done
      - name: Run unit and terminal integration tests
        run: python3 -m unittest discover -s tests -v
