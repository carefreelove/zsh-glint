name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Secure completion directories on the Linux runner
        if: runner.os == 'Linux'
        # Hosted images make these directories writable by non-owner users.
        # Fix this disposable runner instead of bypassing compinit's audit.
        run: sudo chmod go-w /usr/share/zsh /usr/share/zsh/vendor-completions
      - name: Check Zsh syntax
        shell: bash
        run: |
          zsh --version
          for script in terminal-completion.plugin.zsh scripts/*.zsh; do
            zsh -n "$script"
          done
      - name: Audit system completion directories
        shell: zsh -df {0}
        run: |
          fpath=( "${(@M)fpath:#/usr/share/zsh/*}" )
          autoload -Uz compaudit
          compaudit
      - name: Run unit and terminal integration tests
        run: python3 -m unittest discover -s tests -v
